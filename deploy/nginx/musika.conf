# Musika — Nginx reverse proxy
# Serves the whole app under one domain:
#   /            -> Next.js frontend
#   /api, /media, /socket.io -> Node backend
# After certbot runs, an SSL server block is auto-added (see deploy notes).

upstream musika_frontend {
    server frontend:3000;
}
upstream musika_backend {
    server backend:4000;
}

server {
    listen 80;
    server_name _;   # <-- replace with your domain (e.g. musika.example.com)
    client_max_body_size 20m;

    # WebSocket upgrade for Socket.IO (match engine)
    location /socket.io/ {
        proxy_pass http://musika_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://musika_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://musika_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://musika_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
